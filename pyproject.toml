[project]
name = "local-llm-bench"
version = "0.1.0"
description = "ローカル LLM 推論エンジンの prefill / decode 速度を OpenAI・Anthropic 互換 API 越しに計測するツール"
readme = "README.ja.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pyyaml>=6.0",
    "rich>=14.0",
]

[project.scripts]
llm-bench = "local_llm_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_llm_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
